

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый бэкенд проект</title>
    <!-- ОБЯЗАТЕЛЬНО проверь эту строчку, без неё стилей не будет: -->
    <script src="https://tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <!-- Навигационная панель -->
<nav class="bg-slate-800 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
        
        <!-- Логотип / Ссылка на главную -->
        <a href="#" class="text-xl font-bold tracking-wide">Django Навбар</a>
        
        <!-- Правая часть: Логика авторизации -->
        <div class="flex items-center gap-4">
            {% if user.is_authenticated %}
                <!-- Если юзер залогинен -->
                <span class="text-gray-300 text-sm">Привет, <strong class="text-white">{{ user.username }}</strong>!</span>
                <a href="#" class="bg-red-600 hover:bg-red-700 text-sm px-4 py-2 rounded transition">Выйти</a>
            {% else %}
                <!-- Если юзер гость -->
                <a href="#" class="bg-blue-600 hover:bg-blue-700 text-sm px-4 py-2 rounded transition">Войти</a>
            {% endif %}
        </div>

    </div>
</nav>

    <div class="container mx-auto px-4 mt-6">
    {% block content%}
    
    {% endblock %}
    </div>
</body>

</html>
