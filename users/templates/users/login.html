{% extends 'users/base.html' %}

{% block content %}
<div class="grid place-items-center mt-12">
    
    <!-- Карточка формы (исправили border-gray-200) -->
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Вход в аккаунт</h2>
        
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <!-- Поле Логина (все в одну строку или аккуратно закрыто скобкой) -->
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">Имя пользователя</label>
                <input type="text" name="username" id="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>
            
            <!-- Поле Пароля -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Пароль</label>
                <input type="password" name="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            {% if error %}
                <div class="bg-red-50 border-l-4 border-red-500 p-3 rounded text-sm text-red-700 font-medium">
                    {{ error }}
                </div>
            {% endif %}
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-sm">
                Войти
            </button>
        </form>

    </div>
</div>
{% endblock %}
